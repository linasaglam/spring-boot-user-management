<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
</head>
<body>

<h2>Add User</h2>

<form action="/add" method="post" th:object="${user}">
    Name: <input type="text" th:field="*{name}" required><br>
    Email: <input type="email" th:field="*{email}" required><br>
    <button type="submit">Add</button>
</form>

<hr>

<h2>All Users</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Action</th>
    </tr>

    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.name}"></td>
        <td th:text="${u.email}"></td>
        <td>
            <a th:href="@{/delete/{id}(id=${u.id})}">Delete</a>
        </td>
    </tr>

</table>

</body>
</html>
